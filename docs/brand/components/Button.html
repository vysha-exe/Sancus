<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sancus · Button</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body { margin: 0; padding: 24px; background: var(--surface-000); }</style>
</head>
<body>
<div class="sx">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:24px">
    <button class="sx-btn sx-btn--primary" type="button">Pay R$ 541,23</button>
    <button class="sx-btn sx-btn--secondary" type="button">Change amount</button>
    <button class="sx-btn sx-btn--quiet" type="button">View receipt</button>
    <button class="sx-btn sx-btn--primary sx-btn--sm" type="button">New card</button>
    <button class="sx-btn sx-btn--primary" type="button" disabled>Pay</button>
  </div>
  <div class="sx-night" style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:24px">
    <button class="sx-btn sx-btn--primary" type="button">Open your account</button>
    <button class="sx-btn sx-btn--secondary" type="button">How settlement works</button>
  </div>
</div>
</body>
</html>
