  <div style="background:var(--brand-limestone);border-radius:var(--radius-md);padding:40px 16px;display:grid;place-items:center;gap:10px"><span class="sx-lockup sx-wordmark" style="color:#12201E"><svg aria-hidden="true" style="color:var(--brand-deep)"><use href="#column"/></svg>SANCUS</span><span class="sx-label" style="color:#5A6966">Line · on limestone</span></div>
