<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sancus · HeroGlobe</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body { margin: 0; padding: 24px; background: var(--surface-000); }</style>
</head>
<body>
<div class="sx sx-night" style="display:grid;place-items:center;padding:16px;min-height:500px">
  <canvas id="g" style="width:min(480px,100%);aspect-ratio:1" role="img" aria-label="Rotating globe with payments arcing from São Paulo to New York, Mexico City, Lisbon, Bangkok and Jakarta"></canvas>
</div>
<script>
(() => {
  const cv = document.getElementById('g'), ctx = cv.getContext('2d');
  const SIG = (getComputedStyle(document.documentElement).getPropertyValue('--brand-signal') || '').trim() || '#8CC7B5';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, D = Math.PI / 180, tilt = 18 * D;
  const C = { sp: [-23.5, -46.6, 'São Paulo', 'Pix'], ny: [40.7, -74, 'New York', 'ACH'], mx: [19.4, -99.1, 'Mexico City', 'SPEI'], li: [38.7, -9.1, 'Lisbon', 'SEPA'], bk: [13.7, 100.5, 'Bangkok', 'PromptPay'], jk: [-6.2, 106.8, 'Jakarta', 'QRIS'] };
  const A = [['sp', 'ny', 0], ['sp', 'mx', 0.3], ['sp', 'li', 0.55], ['li', 'bk', 0.15], ['bk', 'jk', 0.7]];
  const v = (la, lo) => [Math.cos(la * D) * Math.sin(lo * D), Math.sin(la * D), Math.cos(la * D) * Math.cos(lo * D)];
  let W, R, cx, cy;
  function size() { const d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect(); W = r.width || 480; cv.width = W * d; cv.height = W * d; ctx.setTransform(d, 0, 0, d, 0, 0); R = W * 0.42; cx = cy = W / 2; }
  function p(q, rot) { const [x, y, z] = q, x1 = x * Math.cos(rot) + z * Math.sin(rot), z1 = -x * Math.sin(rot) + z * Math.cos(rot); return [cx + x1 * R, cy - (y * Math.cos(tilt) - z1 * Math.sin(tilt)) * R, y * Math.sin(tilt) + z1 * Math.cos(tilt)]; }
  function sl(a, b, t) { const d = Math.acos(Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2])), s = Math.sin(d), k1 = Math.sin((1 - t) * d) / s, k2 = Math.sin(t * d) / s, h = 1 + 0.22 * Math.sin(Math.PI * t) * Math.min(1, d); return [(a[0] * k1 + b[0] * k2) * h, (a[1] * k1 + b[1] * k2) * h, (a[2] * k1 + b[2] * k2) * h]; }
  const vis = q => q[2] > 0 || Math.hypot(q[0] - cx, q[1] - cy) > R;
  function f(ms) {
    const t = ms / 1000, rot = reduce ? 0.9 : 0.9 + t * 0.12;
    ctx.clearRect(0, 0, W, W);
    const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R); g.addColorStop(0, '#1A2E2B'); g.addColorStop(1, '#0E1615');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(140,199,181,.35)'; ctx.lineWidth = 1; ctx.stroke();
    const seg = s => { for (let i = 1; i < s.length; i++) { const a = s[i - 1], b = s[i]; if (a[2] <= 0 || b[2] <= 0) continue; ctx.strokeStyle = 'rgba(160,220,205,' + (0.08 + a[2] * 0.32) + ')'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } };
    ctx.lineWidth = 0.8;
    for (let la = -75; la <= 75; la += 15) { const s = []; for (let lo = 0; lo <= 360; lo += 4) s.push(p(v(la, lo), rot)); seg(s); }
    for (let lo = 0; lo < 360; lo += 15) { const s = []; for (let la = -90; la <= 90; la += 4) s.push(p(v(la, lo), rot)); seg(s); }
    for (const [a, b, o] of A) {
      const P = v(C[a][0], C[a][1]), Q = v(C[b][0], C[b][1]); let pr = null; ctx.lineWidth = 1.6; ctx.strokeStyle = SIG;
      for (let i = 0; i <= 60; i++) { const q = p(sl(P, Q, i / 60), rot); if (pr && vis(q) && vis(pr)) { ctx.beginPath(); ctx.moveTo(pr[0], pr[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); } pr = q; }
      const q = p(sl(P, Q, reduce ? 0.6 : (t * 0.28 + o) % 1), rot);
      if (vis(q)) { ctx.fillStyle = SIG; ctx.shadowColor = SIG; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(q[0], q[1], 3.2, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
    }
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    for (const k in C) {
      const c = C[k], q = p(v(c[0], c[1]), rot); if (q[2] <= 0.05) continue;
      ctx.globalAlpha = Math.min(1, q[2] * 2); ctx.fillStyle = '#0E1615'; ctx.strokeStyle = SIG; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#E4EAE6'; ctx.fillText(c[2], q[0] + 10, q[1] - 4); ctx.fillStyle = SIG; ctx.fillText(c[3], q[0] + 10, q[1] + 10); ctx.globalAlpha = 1;
    }
    if (!reduce) requestAnimationFrame(f);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(f);
})();
</script>
</body>
</html>
