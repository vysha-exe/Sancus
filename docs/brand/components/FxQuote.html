<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sancus · FxQuote</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>body { margin: 0; padding: 24px; background: var(--surface-000); }</style>
</head>
<body>
<div class="sx" style="padding:20px 24px">
  <div class="sx-panel sx-quote" style="max-width:420px">
    <span class="sx-label">Review payment</span>
    <dl>
      <dt>You pay</dt><dd>$100.00</dd>
      <dt>Rate</dt><dd>1 USD = 5.4123 BRL</dd>
      <dt>Fee</dt><dd>$0.80</dd>
      <dt>Rail</dt><dd><span class="sx-rail">Pix</span> · within seconds</dd>
    </dl>
    <div class="sx-quote__receive"><span>Juliana receives</span><b>R$ 537,90</b></div>
    <span class="sx-quote__lock">Rate locked · 0:42</span>
    <button class="sx-btn sx-btn--primary" type="button">Pay R$ 537,90</button>
  </div>
</div>
</body>
</html>
