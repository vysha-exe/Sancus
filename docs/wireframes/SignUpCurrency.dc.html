<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sancus · Sign up · Home currency</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sancus/tokens.css">
<link rel="stylesheet" href="sancus/components.css">
<link rel="stylesheet" href="sancus/site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--brand-deep)}
</style>
</helmet>
<div class="sx auth" data-theme="day">
  <div class="auth-main">
    <header class="auth-head">
      <a href="Site.dc.html" class="sx-lockup sx-wordmark" aria-label="Sancus home"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="9" width="50" height="8.5" rx="1.5" fill="currentColor"></rect><rect x="12" y="20" width="40" height="3.6" rx=".6" fill="currentColor"></rect><rect x="13.2" y="27.5" width="4.6" height="12.5" rx="1" fill="currentColor"></rect><rect x="21.45" y="27.5" width="4.6" height="18.5" rx="1" fill="currentColor"></rect><path d="M32 27.5 C 26.5 31.5 37.5 35.5 32 39.5 L32 50" stroke="currentColor" stroke-width="4.6" fill="none"></path><rect x="37.95" y="27.5" width="4.6" height="26.5" rx="1" fill="currentColor"></rect><rect x="46.2" y="27.5" width="4.6" height="31.5" rx="1" fill="currentColor"></rect></svg>SANCUS</a>
      <div class="auth-head-end"><span class="sx-pill sx-pill--simulated">Sandbox · testnet</span></div>
    </header>
    <div class="auth-body">
    <form aria-labelledby="q">
      <div class="auth-q"><span class="sx-label">Step 5 of 6</span><h1 id="q" class="sx-h heading-1">Pick your home currency</h1><p class="body-l lead">We'll show amounts in it next to dollars. Your balance stays in US dollars.</p></div>
      <div class="opts" role="radiogroup" aria-label="Home currency">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}"><span class="code3">{{o.code}}</span><b>{{o.name}}</b><small>{{o.note}}</small></button>
        </sc-for>
      </div>
      <div class="auth-btns"><a href="SignUpTeam.dc.html" class="sx-btn sx-btn--primary">Continue</a><a href="Onboarding.dc.html" class="sx-btn sx-btn--secondary">Back</a></div>
    </form>
    </div>
  </div>
  <aside class="build" aria-label="Sign-up progress">
    <svg class="build-col" viewBox="0 4 64 58" role="img" aria-label="4 of 6 steps done"><rect class="f-todo" x="7" y="9" width="50" height="8.5" rx="1.5"></rect><rect class="f-todo" x="12" y="20" width="40" height="3.6" rx=".6"></rect><rect class="f-done" x="13.2" y="27.5" width="4.6" height="12.5" rx="1"></rect><rect class="f-done" x="21.45" y="27.5" width="4.6" height="18.5" rx="1"></rect><path class="f-done" d="M32 27.5 C 26.5 31.5 37.5 35.5 32 39.5 L32 50" stroke-width="4.6"></path><rect class="f-done" x="37.95" y="27.5" width="4.6" height="26.5" rx="1"></rect><rect class="f-now" x="46.2" y="27.5" width="4.6" height="31.5" rx="1"></rect></svg>
    <ol class="build-list build-list--6"><li class="done"><b>1</b>Email</li><li class="done"><b>2</b>Code</li><li class="done"><b>3</b>Type</li><li class="done"><b>4</b>Company</li><li class="now"><b>5</b>Currency</li><li class=""><b>6</b>Team</li></ol>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.cur) || 'BRL';
    const list = [['BRL', 'Brazilian real', 'Suggested for Brazil'], ['USD', 'US dollar', 'Dollars only'], ['MXN', 'Mexican peso', 'Mexico'], ['EUR', 'Euro', 'Euro area']];
    return { opts: list.map(([code, name, note]) => ({ code, name, note, on: String(code === sel), cls: code === sel ? 'opt opt--on' : 'opt', pick: () => this.setState({ cur: code }) })) };
  }
}
</script>
</body>
</html>
