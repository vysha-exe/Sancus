<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sancus · Sign up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sancus/tokens.css">
<link rel="stylesheet" href="sancus/components.css">
<link rel="stylesheet" href="sancus/site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--brand-deep)}
</style>
</helmet>
<div class="sx auth" data-theme="day">
  <div class="auth-main">
    <header class="auth-head">
      <a href="Site.dc.html" class="sx-lockup sx-wordmark" aria-label="Sancus home"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="9" width="50" height="8.5" rx="1.5" fill="currentColor"></rect><rect x="12" y="20" width="40" height="3.6" rx=".6" fill="currentColor"></rect><rect x="13.2" y="27.5" width="4.6" height="12.5" rx="1" fill="currentColor"></rect><rect x="21.45" y="27.5" width="4.6" height="18.5" rx="1" fill="currentColor"></rect><path d="M32 27.5 C 26.5 31.5 37.5 35.5 32 39.5 L32 50" stroke="currentColor" stroke-width="4.6" fill="none"></path><rect x="37.95" y="27.5" width="4.6" height="26.5" rx="1" fill="currentColor"></rect><rect x="46.2" y="27.5" width="4.6" height="31.5" rx="1" fill="currentColor"></rect></svg>SANCUS</a>
      <div class="auth-head-end">Have an account? <a href="SignIn.dc.html">Sign in</a><span class="sx-pill sx-pill--simulated">Sandbox · testnet</span></div>
    </header>
    <div class="auth-body">
    <form aria-labelledby="q">
      <div class="auth-q"><span class="sx-label">Step 1 of 5</span><h1 id="q" class="sx-h heading-1">Let's start with your email.</h1></div>
      <div class="auth-fields">
        <label class="sx-field"><span class="sx-label">First name</span><input class="sx-field__input" autocomplete="given-name" value="Maya"></label>
        <label class="sx-field"><span class="sx-label">Work email</span><input class="sx-field__input" type="email" autocomplete="email" value="maya@cafepaulista.com.br"></label>
        <label class="check"><input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}"><span>I agree to the <a href="#terms">Terms</a> and <a href="#privacy">Privacy policy</a>.</span></label>
      </div>
      <div class="auth-btns"><a href="SignUpCode.dc.html" class="sx-btn sx-btn--primary">Continue</a><a href="Main.dc.html" class="sx-btn sx-btn--secondary">Try the demo</a></div>
    </form>
    </div>
  </div>
  <aside class="build" aria-label="Sign-up progress">
    <svg class="build-col" viewBox="0 4 64 58" role="img" aria-label="0 of 5 steps done"><rect class="cap-done" x="7" y="9" width="50" height="8.5" rx="1.5"></rect><rect class="cap-done" x="12" y="20" width="40" height="3.6" rx=".6"></rect><rect class="f-now" x="13.2" y="27.5" width="4.6" height="12.5" rx="1"></rect><rect class="f-todo" x="21.45" y="27.5" width="4.6" height="18.5" rx="1"></rect><rect class="f-todo" x="29.7" y="27.5" width="4.6" height="22.5" rx="1"></rect><rect class="f-todo" x="37.95" y="27.5" width="4.6" height="26.5" rx="1"></rect><rect class="f-todo" x="46.2" y="27.5" width="4.6" height="31.5" rx="1"></rect></svg>
    <ol class="build-list"><li class="now"><b>1</b>Email</li><li class=""><b>2</b>Code</li><li class=""><b>3</b>Company</li><li class=""><b>4</b>Currency</li><li class=""><b>5</b>Team</li></ol>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const agreed = this.state && this.state.agreed === false ? false : true;
    return { agreed, toggle: () => this.setState({ agreed: !agreed }) };
  }
}
</script>
</body>
</html>
