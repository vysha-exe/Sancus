</style>

<div class="sx auth" data-theme="day">
  <div class="auth-main">
    <header class="auth-head">
      <a href="Site.dc.html" class="sx-lockup sx-wordmark" aria-label="Sancus home"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="9" width="50" height="8.5" rx="1.5" fill="currentColor"></rect><rect x="12" y="20" width="40" height="3.6" rx=".6" fill="currentColor"></rect><rect x="13.2" y="27.5" width="4.6" height="12.5" rx="1" fill="currentColor"></rect><rect x="21.45" y="27.5" width="4.6" height="18.5" rx="1" fill="currentColor"></rect><path d="M32 27.5 C 26.5 31.5 37.5 35.5 32 39.5 L32 50" stroke="currentColor" stroke-width="4.6" fill="none"></path><rect x="37.95" y="27.5" width="4.6" height="26.5" rx="1" fill="currentColor"></rect><rect x="46.2" y="27.5" width="4.6" height="31.5" rx="1" fill="currentColor"></rect></svg>SANCUS</a>
      <div class="auth-head-end"><span class="sx-pill sx-pill--simulated">Sandbox · testnet</span></div>
    </header>
    <div class="auth-body">
    <form aria-labelledby="q">
      <div class="auth-q"><span class="sx-label">Step 4 of 6</span><h1 id="q" class="sx-h heading-1">What's your company called?</h1><p class="body-l lead">Use the legal name on your registration. You can add a trading name later.</p></div>
      <div class="auth-fields">
        <label class="sx-field"><span class="sx-label">Legal name</span><input class="sx-field__input" autocomplete="organization" value="Café Paulista Ltda"></label>
        <label class="sx-field"><span class="sx-label">Country of registration</span>
          <select class="sx-field__input"><option>Brazil</option><option>Mexico</option><option>Indonesia</option><option>Thailand</option><option>Portugal</option><option>United States</option></select>
          <span class="sx-field__help">We'll ask for your CNPJ when you go live. Not needed in the sandbox.</span>
        </label>
      </div>
      <div class="auth-btns"><a href="SignUpCurrency.dc.html" class="sx-btn sx-btn--primary">Continue</a><a href="SignUpAccountType.dc.html" class="sx-btn sx-btn--secondary">Back</a></div>
    </form>
    </div>
  </div>
  <aside class="build" aria-label="Sign-up progress">
    <svg class="build-col" viewBox="0 4 64 58" role="img" aria-label="3 of 6 steps done"><rect class="f-todo" x="7" y="9" width="50" height="8.5" rx="1.5"></rect><rect class="f-todo" x="12" y="20" width="40" height="3.6" rx=".6"></rect><rect class="f-done" x="13.2" y="27.5" width="4.6" height="12.5" rx="1"></rect><rect class="f-done" x="21.45" y="27.5" width="4.6" height="18.5" rx="1"></rect><path class="f-done" d="M32 27.5 C 26.5 31.5 37.5 35.5 32 39.5 L32 50" stroke-width="4.6"></path><rect class="f-now" x="37.95" y="27.5" width="4.6" height="26.5" rx="1"></rect><rect class="f-todo" x="46.2" y="27.5" width="4.6" height="31.5" rx="1"></rect></svg>
    <ol class="build-list build-list--6"><li class="done"><b>1</b>Email</li><li class="done"><b>2</b>Code</li><li class="done"><b>3</b>Type</li><li class="now"><b>4</b>Company</li><li class=""><b>5</b>Currency</li><li class=""><b>6</b>Team</li></ol>
  </aside>
</div>
